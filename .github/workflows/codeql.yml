name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Go
    # Code scanning on a private repository needs GitHub Advanced Security;
    # skip it there and run it while the repository is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: server

      # The sibling modules go.mod's replace directives point at.
      - uses: actions/checkout@v5
        with:
          repository: panelarr/meta
          ref: main
          path: meta

      - uses: actions/checkout@v5
        with:
          repository: panelarr/source-api
          ref: main
          path: source-api

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: github/codeql-action/init@v3
        with:
          languages: go
          build-mode: manual
          source-root: server

      - name: Build
        working-directory: server
        run: go build ./...

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:go
