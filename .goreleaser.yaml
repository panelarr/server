# GoReleaser builds the release artifacts when release-please tags a
# version: binaries, archives, checksums and SBOMs. Container images come
# later.
version: 2
project_name: panelarr

before:
  hooks:
    - go mod download
    # Embeds the pinned web app release (WEB_VERSION in the release workflow).
    - make web

builds:
  - id: panelarr
    main: ./cmd/panelarr
    binary: panelarr
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/panelarr/server/internal/buildinfo.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

# release-please writes the changelog and creates the GitHub release;
# GoReleaser adds the artifacts to it.
changelog:
  disable: true

release:
  mode: append
