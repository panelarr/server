# GoReleaser builds the release artifacts when release-please tags a
# version: binaries, archives, checksums, SBOMs and multi-arch images.
version: 2
project_name: panelarr

before:
  hooks:
    - go mod download
    # Embeds the pinned web app release (WEB_VERSION in the release workflow).
    - make web

builds:
  - id: panelarr
    main: ./cmd/panelarr
    binary: panelarr
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/panelarr/server/internal/buildinfo.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/*

dockers_v2:
  - id: image
    ids: [panelarr]
    dockerfile: Dockerfile.release
    images:
      - panelarr/server
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - latest
    extra_files:
      - packaging/config
      - packaging/data
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: server
      org.opencontainers.image.description: Panelarr server with the web app
      org.opencontainers.image.source: https://github.com/panelarr/server
      org.opencontainers.image.licenses: GPL-3.0-or-later
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

# release-please writes the changelog and creates the GitHub release;
# GoReleaser adds the artifacts to it.
changelog:
  disable: true

release:
  mode: append
