# Generates the API models and a strict, typed chi server from openapi.yaml.
# Run `make gen`; the output is committed.
package: apigen
output: internal/api/apigen/api.gen.go
generate:
  models: true
  chi-server: true
  strict-server: true
  embedded-spec: true
output-options:
  nullable-type: false
  # The event stream flushes each event as it happens, which the generated
  # strict handlers can't do; it is served by hand (internal/api/events.go).
  exclude-operation-ids: [streamEvents]
compatibility:
  # Enum constants carry their type name (ContentRatingSafe, RoleAdmin), so
  # values shared by several enums never collide.
  always-prefix-enum-values: true
